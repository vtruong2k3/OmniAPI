<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="omniTitle omniDesc">
  <title id="omniTitle">OmniAPI</title>
  <desc id="omniDesc">OmniAPI - The Unified AI Gateway and Intelligent Model Router</desc>
  <defs>
    <!-- Dark Cosmic Background Gradient -->
    <linearGradient id="omni-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071924"/>
      <stop offset="50%" stop-color="#04121a"/>
      <stop offset="100%" stop-color="#02080d"/>
    </linearGradient>

    <!-- Ambient Cyan Glow -->
    <radialGradient id="omni-glow" cx="256" cy="256" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#04121a" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Focal Light -->
    <radialGradient id="omni-core-glow" cx="256" cy="256" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>

    <!-- Ribbon Gradients: Emerald -> Cyan -> Blue -> Violet -->
    <linearGradient id="omni-ribbon-left" x1="120" y1="120" x2="280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="omni-ribbon-right" x1="240" y1="110" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="omni-ribbon-bottom" x1="160" y1="360" x2="360" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="omni-ribbon-top" x1="150" y1="140" x2="360" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="omni-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#02080d" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>

    <filter id="omni-core-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#omni-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#omni-glow)"/>
  <!-- Cyber Rim Border -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Core Gateway Portal Glow -->
  <circle cx="256" cy="256" r="85" fill="url(#omni-core-glow)" filter="url(#omni-core-blur)"/>

  <!-- The OmniAPI "O" Mobius Gateway Emblem -->
  <g filter="url(#omni-shadow)">
    <!-- Back Loop Arc (Depth Layer) -->
    <path d="M190 155 C 230 115, 282 115, 322 155 C 375 208, 385 285, 345 345 C 305 405, 220 415, 160 365 C 135 345, 120 315, 118 285 C 115 240, 140 190, 190 155 Z" 
          fill="none" 
          stroke="url(#omni-ribbon-top)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95"/>

    <!-- Left Gateway Segment -->
    <path d="M165 355 C 130 315, 125 245, 155 190 C 185 135, 255 125, 310 155 C 335 168, 355 190, 365 215" 
          fill="none" 
          stroke="url(#omni-ribbon-left)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Gateway Segment -->
    <path d="M347 165 C 385 210, 390 280, 355 335 C 320 390, 250 400, 195 370 C 170 356, 150 334, 140 310" 
          fill="none" 
          stroke="url(#omni-ribbon-right)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Intersecting Mobius Core Node (Front Ribbon Crossing) -->
    <path d="M185 220 C 215 185, 295 185, 325 220 C 355 255, 355 305, 325 340 C 295 375, 215 375, 185 340 C 160 310, 160 250, 185 220 Z"
          fill="none"
          stroke="url(#omni-ribbon-bottom)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Central Fusion Core (Gateway Nexus Dot) -->
    <circle cx="256" cy="256" r="18" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="256" r="28" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.8"/>
    <circle cx="256" cy="256" r="42" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  </g>

  <!-- Subtle Speed Stream Particle Points -->
  <circle cx="165" cy="175" r="4" fill="#34d399" opacity="0.85"/>
  <circle cx="355" cy="205" r="4" fill="#38bdf8" opacity="0.85"/>
  <circle cx="330" cy="365" r="4" fill="#818cf8" opacity="0.85"/>
  <circle cx="145" cy="325" r="4" fill="#10b981" opacity="0.85"/>
</svg>
